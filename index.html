<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的第一个网站</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding-top: 150px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            color: #aaa;
            font-size: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>我的第一个网站</h1>

        <p>网站成功运行了！</p>

        <button onclick="alert('你好！')">
            点击我
        </button>

    </div>

</body>
</html>
